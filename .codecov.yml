coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
        informational: false      # Hard fail, not just a warning
        if_ci_failed: error
        branches:
          - develop               # Enforcement ONLY when targeting develop
    patch:
      default:
        informational: true       # Patch check is advisory everywhere else

#
#coverage:
#  status:
#    project:
#      default:
#        target: 100%

# Kept deliberately short: JaCoCo has already decided what enters the report
# (see fileFilter in app/build.gradle.kts), so anything listed twice only hides
# drift between the two lists. Production code is NOT ignored here — if it ships,
# it counts.
ignore:
  # @Preview scaffolding — hand-written, but never runs in production
  - "app/src/main/java/**/ui/preview/**"

  # Test sources
  - "**/test/**"
  - "**/androidTest/**"








#      Any push / any PR
#      │
#      ▼
#      CI runs on everything ✓
#      Tests run, coverage uploaded
#      │
#      ▼
#      Is this PR targeting develop?
#      ┌──────────┴──────────┐
#      YES                    NO
#      │                      │
#      ▼                      ▼
#      Codecov compares      Codecov shows
#      vs develop coverage   coverage info
#      │                 (no gate)
#      Coverage dropped?
#      ┌────┴────┐
#      YES        NO
#      │          │
#      ✗ fail    ✓ pass
#      status    status
#      check     check